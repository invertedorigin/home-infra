---
version: "3"

env:
  TALOSCONFIG: "{{.PROJECT_DIR}}/talos/clusterconfig/talosconfig"

vars:
  clusterName: invertedorigin
  # k8s.home.arpa resolves to the routed API VIP (10.246.0.32); see talos/README.md.
  endpoint: https://k8s.home.arpa:6443
  schematicID: 4d2f14467f85468b6b5ff0ba1747f7f0bcb97d351d516db0197885247093d6fd
  # renovate: datasource=github-releases depName=siderolabs/talos
  talosVersion: v1.14.1
  # Keep the factory installer image aligned with the running Talos version.
  installerVersion: v1.14.1
  # renovate: datasource=github-releases depName=kubernetes/kubernetes
  kubernetesVersion: v1.37.1

tasks:
  genconfig:
    desc: Generate Talos configs with talosctl
    interactive: true
    dir: "{{.PROJECT_DIR}}/talos"
    cmds:
      - |
        set -eu
        work_dir="$(mktemp -d "${TMPDIR:-/tmp}/talos-config.XXXXXX")"
        trap 'rm -rf -- "$work_dir"' EXIT
        chmod 700 "$work_dir"

        doppler secrets substitute \
          --project talos \
          --config prdv2 \
          --output "$work_dir/secrets.yaml" \
          secrets.yaml.tmpl
        chmod 600 "$work_dir/secrets.yaml"

        talosctl gen config \
          {{.clusterName}} \
          {{.endpoint}} \
          --with-secrets "$work_dir/secrets.yaml" \
          --talos-version {{.talosVersion}} \
          --kubernetes-version {{trimPrefix "v" .kubernetesVersion}} \
          --install-image factory.talos.dev/installer/{{.schematicID}}:{{.installerVersion}} \
          --with-docs=false \
          --with-examples=false \
          --output "$work_dir/generated"

        for node in node-1 node-2 node-3; do
          talosctl machineconfig patch \
            "$work_dir/generated/controlplane.yaml" \
            --patch "@nodes/${node}.yaml" \
            --output "$work_dir/generated/{{.clusterName}}-${node}.yaml"
        done

        talosctl machineconfig patch \
          "$work_dir/generated/worker.yaml" \
          --patch @nodes/usb-node-2.yaml \
          --output "$work_dir/generated/{{.clusterName}}-usb-node-2.yaml"

        for config in "$work_dir/generated/{{.clusterName}}-"*.yaml; do
          talosctl validate --config "$config" --mode metal
        done

        mkdir -p clusterconfig
        install -m 0600 "$work_dir/generated/talosconfig" clusterconfig/talosconfig
        for config in "$work_dir/generated/{{.clusterName}}-"*.yaml; do
          install -m 0600 "$config" "clusterconfig/$(basename "$config")"
        done

  mergeclientconfig:
    desc: Merge cluster talos client config into home directory default talosconfig
    interactive: true
    dir: "{{.PROJECT_DIR}}/talos"
    requires:
      vars: [cluster]
    cmds:
      - talosctl config merge --context={{.cluster}} \
        --talosconfig=$HOME/.talos/config "{{.PROJECT_DIR}}/talos/clusterconfig/talosconfig"

  bootstrap:
    desc: Bootstrap talos cluster
    interactive: true
    dir: "{{.PROJECT_DIR}}/talos"
    requires:
      vars: [cluster, node]
    cmds:
      - talosctl bootstrap -n {{.node}}

  disks:
    desc: Get disks
    interactive: true
    dir: "{{.PROJECT_DIR}}/talos"
    requires:
      vars: [cluster, ip]
    cmds:
      - talosctl -n {{.ip}} disks --insecure

  get-machine:
    desc: Get machine
    interactive: true
    dir: "{{.PROJECT_DIR}}/talos"
    requires:
      vars: [cluster, node]
    cmds:
      - talosctl -n {{.node}} get mc
