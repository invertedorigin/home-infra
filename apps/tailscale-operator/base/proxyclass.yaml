apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: node-1
spec:
  statefulSet:
    pod:
      labels:
        team: eng
        environment: prod
      nodeSelector:
        kubernetes.io/hostname: "node-1"
      tailscaleContainer:
        resources:
          limits:
            devic.es/tun: "1"
