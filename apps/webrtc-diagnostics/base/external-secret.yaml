apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: webrtc-diagnostics-turn
  namespace: webrtc-diagnostics
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ANYTONE_CF_TURN_KEY_ID
        metadataPolicy: None
      secretKey: ANYTONE_CF_TURN_KEY_ID
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ANYTONE_CF_TURN_API_TOKEN
        metadataPolicy: None
      secretKey: ANYTONE_CF_TURN_API_TOKEN
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: webrtc-diagnostics-turn
