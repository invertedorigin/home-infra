apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: diagnostic
    app.kubernetes.io/instance: webrtc-diagnostics
    app.kubernetes.io/name: webrtc-diagnostics
  name: webrtc-diagnostics
  namespace: webrtc-diagnostics
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: diagnostic
      app.kubernetes.io/instance: webrtc-diagnostics
      app.kubernetes.io/name: webrtc-diagnostics
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: diagnostic
        app.kubernetes.io/instance: webrtc-diagnostics
        app.kubernetes.io/name: webrtc-diagnostics
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: build-app
          image: golang:1.25.12-bookworm
          command:
            - /bin/sh
            - -ec
          args:
            - |
              cp /source/go.mod /source/go.sum /source/main.go /app/
              mkdir -p /app/public
              cp /source/index.html /source/app.js /source/style.css /app/public/
              cp /etc/ssl/certs/ca-certificates.crt /app/ca-certificates.crt
              cd /app
              CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o /app/webrtc-diagnostics .
          env:
            - name: GOCACHE
              value: /tmp
            - name: GOMODCACHE
              value: /tmp/go-mod
            - name: GOFLAGS
              value: -mod=readonly
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /app
              name: app
            - mountPath: /source
              name: source
              readOnly: true
            - mountPath: /tmp
              name: tmp
      containers:
        - name: app
          image: debian:bookworm-slim
          command:
            - /app/webrtc-diagnostics
          env:
            - name: LISTEN_ADDRESS
              value: :8080
            - name: PUBLIC_DIR
              value: /app/public
            - name: SSL_CERT_FILE
              value: /app/ca-certificates.crt
            - name: ANYTONE_CF_TURN_TTL
              value: "900"
            - name: ANYTONE_CF_TURN_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: ANYTONE_CF_TURN_KEY_ID
                  name: webrtc-diagnostics-turn
                  optional: true
            - name: ANYTONE_CF_TURN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ANYTONE_CF_TURN_API_TOKEN
                  name: webrtc-diagnostics-turn
                  optional: true
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 50000
              name: ice-udp-min
              protocol: UDP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /app
              name: app
              readOnly: true
            - mountPath: /tmp
              name: tmp
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 10
      volumes:
        - emptyDir: {}
          name: app
        - configMap:
            name: webrtc-diagnostics-app
          name: source
        - emptyDir: {}
          name: tmp
