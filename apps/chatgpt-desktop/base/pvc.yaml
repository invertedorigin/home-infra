apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatgpt-desktop-config
  namespace: chatgpt-desktop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: ceph-rbd
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chatgpt-desktop-workspace
  namespace: chatgpt-desktop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: ceph-rbd

