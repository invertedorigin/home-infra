apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: desktop
    app.kubernetes.io/instance: chatgpt-desktop
    app.kubernetes.io/name: chatgpt-desktop
  name: chatgpt-desktop
  namespace: chatgpt-desktop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: desktop
      app.kubernetes.io/instance: chatgpt-desktop
      app.kubernetes.io/name: chatgpt-desktop
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: desktop
        app.kubernetes.io/instance: chatgpt-desktop
        app.kubernetes.io/name: chatgpt-desktop
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: DISABLE_DRI3
              value: "true"
            - name: DISABLE_ZINK
              value: "true"
            - name: GH_PROMPT_DISABLED
              value: "true"
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: chatgpt-desktop-github
            - name: LIBGL_ALWAYS_SOFTWARE
              value: "true"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: START_DOCKER
              value: "false"
            - name: TITLE
              value: ChatGPT Codex
            - name: TZ
              value: America/Denver
          image: lscr.io/linuxserver/webtop:ubuntu-xfce@sha256:5079531006cfe3777969da37b3f61f8c82e4112a7a67c23b4e1f12e5976804eb
          livenessProbe:
            failureThreshold: 6
            periodSeconds: 20
            tcpSocket:
              port: http
            timeoutSeconds: 2
          name: desktop
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 12
            periodSeconds: 10
            tcpSocket:
              port: http
            timeoutSeconds: 2
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            failureThreshold: 60
            periodSeconds: 10
            tcpSocket:
              port: http
            timeoutSeconds: 2
          volumeMounts:
            - mountPath: /custom-cont-init.d/10-install-chatgpt
              name: bootstrap
              readOnly: true
              subPath: 10-install-chatgpt
            - mountPath: /config
              name: config
            - mountPath: /dev/shm
              name: shared-memory
            - mountPath: /workspace
              name: workspace
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - configMap:
            defaultMode: 0555
            name: chatgpt-desktop-bootstrap
          name: bootstrap
        - name: config
          persistentVolumeClaim:
            claimName: chatgpt-desktop-config
        - emptyDir:
            medium: Memory
            sizeLimit: 1Gi
          name: shared-memory
        - name: workspace
          persistentVolumeClaim:
            claimName: chatgpt-desktop-workspace
