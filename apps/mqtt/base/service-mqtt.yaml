apiVersion: v1
kind: Service
metadata:
  name: nats-mqtt
  labels:
    external-dns.invertedorigin.com/enabled: "true"
  annotations:
    lbipam.cilium.io/ips: 10.0.1.9
    external-dns.kubernetes.io/hostname: mqtt.home.arpa
    external-dns.kubernetes.io/ttl: "60"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  ports:
  - name: mqtt
    port: 1883
    protocol: TCP
    targetPort: mqtt
  selector:
    app.kubernetes.io/component: nats
    app.kubernetes.io/instance: nats
    app.kubernetes.io/name: nats
