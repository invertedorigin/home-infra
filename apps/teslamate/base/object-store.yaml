apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: teslamate-r2
  namespace: teslamate
spec:
  # Server names are set per use in the Cluster's plugin parameters, so the
  # existing catalogs (teslamate-db-main-18, teslamate-db-18) carry over.
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://k8s-backups/teslamate-v2-cluster/
    endpointURL: https://f92cf6dd20992e652da4b54bae8dbd53.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: cloudflare-r2-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cloudflare-r2-secret
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
      maxParallel: 8
      encryption: AES256
    data:
      compression: gzip
      encryption: AES256
