apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: teslamate-r2
  namespace: teslamate
spec:
  # Server names are set in each Cluster's plugin parameters. teslamate-db
  # archives to teslamate-db-dhi-18; the retired teslamate-db-main-18 and
  # teslamate-db-18 catalogs remain in the bucket and are no longer pruned.
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://k8s-backups/teslamate-v2-cluster/
    endpointURL: https://f92cf6dd20992e652da4b54bae8dbd53.r2.cloudflarestorage.com
    s3Credentials:
      accessKeyId:
        name: cloudflare-r2-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cloudflare-r2-secret
        key: AWS_SECRET_ACCESS_KEY
    wal:
      compression: gzip
      maxParallel: 8
      encryption: AES256
    data:
      compression: gzip
      encryption: AES256
