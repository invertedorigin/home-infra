apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: teslamate-db-main
  namespace: teslamate
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-system-trixie
  # Barman Cloud plugin sidecar is a Docker Hardened Image.
  imagePullSecrets:
    - name: dhi-pull-secret
  enablePDB: false
  bootstrap:
    recovery:
      source: clusterBackup
      recoveryTarget:
        backupID: "20260321T212041"

  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: teslamate-r2
          serverName: teslamate-db-18

  storage:
    size: 40Gi
    storageClass: ceph-rbd

  monitoring:
    enablePodMonitor: false

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: teslamate-r2
        serverName: teslamate-db-main-18
