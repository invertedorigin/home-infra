# TeslaMate's Postgres on the Docker Hardened Image (dhi.io/postgres).
# Copied from teslamate-db-main with pg_basebackup. DHI runs Postgres as
# UID/GID 70 (CNPG's own images use 26), so this is a new cluster with a fresh
# volume rather than an in-place image change.
#
# Restoring from Barman Cloud does not work with the DHI sidecar image: it lacks
# the tar binary barman-cloud-restore needs. For a backup restore, set the
# plugin's sidecarImage parameter on the recovery source in externalClusters to
# ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar at the same version.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: teslamate-db
  namespace: teslamate
spec:
  instances: 1
  imageName: dhi.io/postgres:18.7-debian13@sha256:3fc42f4f36adcc9de711ddd1750c715c960fb842c0947ff3b2cf53f70dff30ad
  imagePullSecrets:
    - name: dhi-pull-secret
  postgresUID: 70
  postgresGID: 70
  enablePDB: false

  bootstrap:
    pg_basebackup:
      source: teslamate-db-main

  externalClusters:
    - name: teslamate-db-main
      connectionParameters:
        host: teslamate-db-main-rw.teslamate.svc
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslKey:
        name: teslamate-db-main-replication
        key: tls.key
      sslCert:
        name: teslamate-db-main-replication
        key: tls.crt
      sslRootCert:
        name: teslamate-db-main-ca
        key: ca.crt

  storage:
    size: 40Gi
    storageClass: ceph-rbd

  monitoring:
    enablePodMonitor: false

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: teslamate-r2
        serverName: teslamate-db-dhi-18
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: teslamate-db
  namespace: teslamate
spec:
  # Six-field cron: seconds first
  schedule: "1 0 0 * * *"
  suspend: false
  immediate: true
  cluster:
    name: teslamate-db
  target: primary
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
