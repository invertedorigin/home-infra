apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Barman Cloud CNPG-I plugin, replacing CloudNativePG's deprecated in-tree
# barmanObjectStore backups. Must share the operator's namespace (cnpg-system,
# owned by apps/cloudnative-pg). Requires cert-manager.
#
# Both images are Docker Hardened Images. The sidecar is injected into Postgres
# instance pods, so every Cluster using this plugin also needs a dhi-pull-secret
# in its own namespace, listed in the Cluster's spec.imagePullSecrets.
namespace: cnpg-system

resources:
- external-secret.yaml

helmCharts:
- name: plugin-barman-cloud
  repo: https://cloudnative-pg.github.io/charts
  version: 0.9.0
  releaseName: barman-cloud
  namespace: cnpg-system
  includeCRDs: true
  valuesInline:
    image:
      registry: dhi.io
      repository: cloudnative-pg-plugin-barman-cloud
      tag: 0.16.0-debian13@sha256:86b9fbbcfb167330250330852726776a9f30085634aad7dd2c4e00c3f6fd627e
    sidecarImage:
      registry: dhi.io
      repository: cloudnative-pg-plugin-barman-cloud-sidecar
      tag: 0.16.0-debian13@sha256:1c66e7d3c9421060603d39716f2e351fc9902d95f4958d3506ba4271fec09394
    imagePullSecrets:
    - name: dhi-pull-secret

patches:
- target:
    group: apiextensions.k8s.io
    version: v1
    kind: CustomResourceDefinition
  patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-options
      value: ServerSideApply=true
