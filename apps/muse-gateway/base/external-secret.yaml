# Secrets for muse-gateway, via the existing Doppler ClusterSecretStore.
#
# Create these keys in Doppler BEFORE merging — the pod will not start
# serving /v1/* without MUSE_GATEWAY_TOKEN, and Claude Code tasks will fail
# without ANTHROPIC_API_KEY:
#   MUSE_GATEWAY_TOKEN  - bearer token Muse (cloud) presents to the gateway.
#                         Generate with: openssl rand -hex 32
#   ANTHROPIC_API_KEY   - Anthropic API key for Claude Code headless runs.
#                         Pay-per-token; see README.md for the subscription
#                         alternative and why the API key is the v1 choice.
#
# No secret values live in git. Only the Doppler key names are listed here,
# following the same ExternalSecret pattern as the other apps in this repo.
#
# Retrievable secrets: the gateway only hands out a secret if its name is in
# the ALLOWED_SECRETS allowlist (base/configmap.yaml). The allowlist is empty
# by default — add a Doppler key here AND its name to the allowlist to make it
# retrievable. MUSE_GATEWAY_TOKEN and ANTHROPIC_API_KEY are hard-denied in
# gateway code and can never be retrieved through the API.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: muse-gateway-secrets
  namespace: muse-gateway
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: muse-gateway-secrets
  data:
    - secretKey: gateway-token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: MUSE_GATEWAY_TOKEN
        metadataPolicy: None
    - secretKey: anthropic-api-key
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: ANTHROPIC_API_KEY
        metadataPolicy: None
    # Example, commented out until a real Doppler key exists and is allowlisted:
    # - secretKey: homeassistant-token
    #   remoteRef:
    #     conversionStrategy: Default
    #     decodingStrategy: None
    #     key: HOMEASSISTANT_TOKEN
    #     metadataPolicy: None
