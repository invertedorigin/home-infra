# Tailscale-only exposure for the gateway. There is deliberately NO public
# Ingress for this app (unlike opencode / homeassistant).
#
# The tailscale-operator (already installed, apps/tailscale-operator) watches
# for this annotation and provisions a proxy pod that joins the tailnet as
# `muse-gateway`, forwarding to the ClusterIP Service above. Muse (cloud)
# reaches it at http://muse-gateway.<tailnet>.ts.net:8080 once its own VM has
# joined the same tailnet as a client (device `muse`) — that join is a
# separate, manual step in the Tailscale admin console.
#
# No Funnel annotation: this must never be exposed to the public internet.
apiVersion: v1
kind: Service
metadata:
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: muse-gateway
  labels:
    app.kubernetes.io/instance: muse-gateway
    app.kubernetes.io/name: muse-gateway
    app.kubernetes.io/service: muse-gateway-tailscale
  name: muse-gateway-tailscale
  namespace: muse-gateway
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: muse-gateway
    app.kubernetes.io/name: muse-gateway
  type: LoadBalancer
