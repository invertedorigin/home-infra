apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-conf-dhcp-default-route
  namespace: kube-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "macvlan-conf-dhcp-default-route",
      "plugins": [
        {
          "type": "macvlan",
          "master": "ens18",
          "mode": "bridge",
          "ipam": {
            "type": "dhcp",
            "provide": [
              {
                "option": "host-name",
                "fromArg": "K8S_POD_NAME"
              }
            ]
          }
        }
      ]
    }
