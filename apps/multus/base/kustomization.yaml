apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
- crd.yaml
- dhcp-network-attachment-sbr.yaml
- external-secret.yaml

images:
- name: ghcr.io/angelnu/cni-plugins
  newTag: 1.9.1
- name: dhi.io/multus-cni
  newTag: 4.3.1-debian13

helmCharts:
- name: multus
  repo: https://angelnu.github.io/helm-charts
  version: 7.0.0
  releaseName: multus
  namespace: kube-system
  valuesInline:
    global:
      createDefaultServiceAccount: false
    cni:
      image:
        repository: ghcr.io/angelnu/cni-plugins
      paths:
        config: /etc/cni/net.d
        bin: /opt/cni/bin

    resources:
      requests:
        cpu: 5m
        memory: 64M
    hostPaths:
      netns: /var/run/netns
    controllers:
      multus:
        pod:
          automountServiceAccountToken: true
        containers:
          multus:
            image:
              repository: dhi.io/multus-cni
      test:
        enabled: false
      uninstall:
        serviceAccount:
          identifier: default
    rawResources:
      test:
        enabled: false


patches:
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: multus
  patch: |-
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: multus
    spec:
      template:
        spec:
          imagePullSecrets:
          - name: dhi-pull-secret
          tolerations:
          - key: hardware.invertedorigin.com/usb
            operator: Equal
            value: "true"
            effect: NoSchedule
          initContainers:
          - name: dhcp-cleanup
            image: busybox
            command: ["/bin/sh"]
            args: ["-c", "rm -f /host/run/cni/dhcp.sock; rm -f /host/opt/cni/bin/multus-shim"]
            securityContext:
              privileged: true
            volumeMounts:
            - name: dhcp-socketpath
              mountPath: /host/run/cni
            - name: multus-shim-bin
              mountPath: /host/opt/cni/bin
          - name: cni-installer
          - name: multus-installer
            # The runtime image supplies a Go installer instead of coreutils cp.
            command: ["/usr/bin/install_multus"]
            args: ["-d", "/host/opt/cni/bin", "-t", "thick"]
            securityContext:
              runAsUser: 0
          containers:
          - name: multus
            # Go's user.Current needs this fallback when UID 0 has no passwd entry.
            env:
            - name: USER
              value: root
            - name: HOME
              value: /root
            # DHI defaults to nonroot; Multus must write root-owned host paths.
            securityContext:
              runAsUser: 0
          - name: dhcp-daemon
            image: ghcr.io/angelnu/cni-plugins
            command:
            - /plugins/dhcp
            args:
            - daemon
            - -hostprefix
            - /host
            resources:
              requests:
                cpu: "100m"
                memory: "50Mi"
              limits:
                cpu: "100m"
                memory: "50Mi"
            securityContext:
              privileged: true
            volumeMounts:
            - name: dhcp-socketpath
              mountPath: /host/run/cni
            - name: procpath
              mountPath: /host/proc
            - name: host-run-netns
              mountPath: /host/var/run/netns
              mountPropagation: HostToContainer
          volumes:
          - name: dhcp-socketpath
            hostPath:
              path: /run/cni
          - name: procpath
            hostPath:
              path: /proc
          - name: multus-shim-bin
            hostPath:
              path: /opt/cni/bin
