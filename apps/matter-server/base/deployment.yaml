apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: matter-server
    app.kubernetes.io/name: matter-server
  name: matter-server
  namespace: matter-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: main
      app.kubernetes.io/instance: matter-server
      app.kubernetes.io/name: matter-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: main
        app.kubernetes.io/instance: matter-server
        app.kubernetes.io/name: matter-server
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [
            {
              "name": "macvlan-conf-dhcp-sbr",
              "namespace": "kube-system",
              "mac": "1a:c1:8d:38:f3:77"
            }
          ]
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: configure-net1-ipv6
        image: busybox:1.38
        command:
        - /bin/sh
        - -ec
        - |
          for _ in $(seq 1 30); do
            ping6 -c1 -I net1 ff02::2%net1 >/dev/null 2>&1 || true
            GW="$(ip -6 neigh show dev net1 | awk '/router/ { print $1; exit }')"
            SRC="$(ip -6 -o addr show dev net1 scope global | awk '{ print $4; exit }')"
            if [ -n "$GW" ] && [ -n "$SRC" ]; then
              ip -6 rule add from "$SRC" table 100 2>/dev/null || true
              ip -6 route replace default via "$GW" dev net1 table 100
              ip -6 route replace default via "$GW" dev net1 metric 1024
              exit 0
            fi
            sleep 2
          done
          echo "failed to discover IPv6 gateway or source on net1" >&2
          exit 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
          runAsUser: 0
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
      containers:
      - env:
        - name: TZ
          value: America/Denver
        - name: STORAGE_PATH
          value: /data
        - name: LOG_LEVEL
          value: info
        - name: LISTEN_ADDRESS
          value: eth0
        - name: PRIMARY_INTERFACE
          value: net1
        - name: PRODUCTION_MODE
          value: "true"
        # Match Python Matter Server's defaults so its existing fabric is migrated.
        - name: FABRIC_ID
          value: "1"
        - name: VENDOR_ID
          value: "65521"
        image: ghcr.io/matter-js/matterjs-server:1.3.3
        name: main
        ports:
        - containerPort: 5580
          name: websocket
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: websocket
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: websocket
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: websocket
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            memory: 250Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /data
          name: data
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: matter-server-pvc-replicated
