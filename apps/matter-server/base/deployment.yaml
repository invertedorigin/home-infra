apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: main
    app.kubernetes.io/instance: matter-server
    app.kubernetes.io/name: matter-server
  name: matter-server
  namespace: matter-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: main
      app.kubernetes.io/instance: matter-server
      app.kubernetes.io/name: matter-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: main
        app.kubernetes.io/instance: matter-server
        app.kubernetes.io/name: matter-server
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [
            {
              "name": "macvlan-conf-dhcp-sbr",
              "namespace": "kube-system",
              "mac": "1a:c1:8d:38:f3:77"
            }
          ]
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        seccompProfile:
          type: RuntimeDefault
      containers:
      - env:
        - name: TZ
          value: "America/Denver"
        - name: STORAGE_PATH
          value: /data
        - name: LOG_LEVEL
          value: info
        - name: LISTEN_ADDRESS
          value: eth0
        - name: PRIMARY_INTERFACE
          value: net1
        - name: PRODUCTION_MODE
          value: "true"
        # Match Python Matter Server's defaults so its existing fabric is migrated.
        - name: FABRIC_ID
          value: "1"
        - name: VENDOR_ID
          value: "65521"
        - name: ENABLE_TIME_SYNC
          value: 1
        image: ghcr.io/matter-js/matterjs-server:1.4.0
        name: main
        ports:
        - containerPort: 5580
          name: websocket
          protocol: TCP
        startupProbe:
          httpGet:
            path: /health
            port: websocket
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: websocket
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: websocket
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            memory: 250Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /data
          name: data
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      serviceAccountName: default
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: matter-server-pvc-replicated
