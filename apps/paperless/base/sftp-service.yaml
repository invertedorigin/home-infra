apiVersion: v1
kind: Service
metadata:
  annotations:
    # Pinned so the scanner's configured address survives re-allocation.
    lbipam.cilium.io/ips: "10.0.1.6"
  labels:
    app.kubernetes.io/instance: paperless
    app.kubernetes.io/name: paperless
    app.kubernetes.io/service: paperless-sftp
  name: paperless-sftp
  namespace: paperless
spec:
  ports:
  - name: sftp
    port: 22
    protocol: TCP
    targetPort: 22
  selector:
    app.kubernetes.io/component: paperless
    app.kubernetes.io/instance: paperless
    app.kubernetes.io/name: paperless
  type: LoadBalancer
