apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: external-dns
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: external-dns
    spec:
      automountServiceAccountToken: true
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.22.0
        args:
        - --source=service
        - --source=ingress
        - --service-type-filter=LoadBalancer
        - --provider=webhook
        - --policy=sync
        - --registry=txt
        - --txt-owner-id=home-cluster
        - --txt-prefix=external-dns-
        - --domain-filter=home.arpa
        - --domain-filter=invertedorigin.com
        - --label-filter=external-dns.invertedorigin.com/enabled=true
        - --ingress-class=cilium
        - --managed-record-types=A
        - --managed-record-types=CNAME
        - --interval=1m
        - --events
        - --log-format=json
        - --log-level=info
        - --metrics-address=:7979
        - --webhook-provider-url=http://127.0.0.1:8888
        - --webhook-provider-read-timeout=30s
        - --webhook-provider-write-timeout=30s
        ports:
        - name: http-metrics
          containerPort: 7979
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-metrics
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http-metrics
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      - name: unifi-webhook
        image: ghcr.io/home-operations/external-dns-unifi-webhook:0.10.12
        env:
        - name: UNIFI_API_KEY
          valueFrom:
            secretKeyRef:
              name: unifi-credentials
              key: api-key
        - name: UNIFI_HOST
          valueFrom:
            secretKeyRef:
              name: unifi-credentials
              key: host
        envFrom:
        - configMapRef:
            name: unifi-webhook-config
        ports:
        - name: http-health
          containerPort: 8080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-health
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-health
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: external-dns
      terminationGracePeriodSeconds: 30
