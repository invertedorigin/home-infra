apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: external-dns
  namespace: external-dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: external-dns
  policyTypes:
  - Ingress
  ingress:
  # Health and metrics remain reachable for kubelet probes and in-cluster
  # monitoring. The webhook API is bound to loopback and is not allowed here.
  - ports:
    - port: 7979
      protocol: TCP
    - port: 8080
      protocol: TCP
