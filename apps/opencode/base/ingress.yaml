apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
    external-dns.alpha.kubernetes.io/target: ingress.home.arpa
    external-dns.alpha.kubernetes.io/ttl: "60"
    nginx.ingress.kubernetes.io/cors-allow-methods: PUT, GET, POST, OPTIONS, HEAD
  labels:
    app.kubernetes.io/instance: opencode
    app.kubernetes.io/name: opencode
    external-dns.invertedorigin.com/enabled: "true"
  name: opencode
  namespace: opencode
spec:
  ingressClassName: cilium
  rules:
  - host: opencode.invertedorigin.com
    http:
      paths:
      - backend:
          service:
            name: opencode
            port:
              number: 4096
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - opencode.invertedorigin.com
    secretName: opencode-tls-domain
