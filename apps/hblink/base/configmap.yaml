apiVersion: v1
kind: ConfigMap
metadata:
  name: hblink-config
data:
  rules.py: |-
    # TG 9999 on TS2 is bridged to a loopback-only playback master. The
    # playback port is not exposed by the Service or the WireGuard firewall.
    BRIDGES = {
        # Each BrandMeister peer has one static TS2 subscription. Keep the
        # talkgroup IDs unchanged while spreading the local master side across
        # both slots so the feeds can be active concurrently.
        'BRANDMEISTER-31088': [
            {
                'SYSTEM': 'MASTER-1',
                'TS': 1,
                'TGID': 31088,
                'ACTIVE': True,
                'TIMEOUT': 0,
                'TO_TYPE': 'NONE',
                'ON': [],
                'OFF': [],
                'RESET': [],
            },
            {
                'SYSTEM': 'BRANDMEISTER-31088',
                'TS': 2,
                'TGID': 31088,
                'ACTIVE': True,
                'TIMEOUT': 0,
                'TO_TYPE': 'NONE',
                'ON': [],
                'OFF': [],
                'RESET': [],
            },
        ],
        'BRANDMEISTER-3121': [
            {
                'SYSTEM': 'MASTER-1',
                'TS': 2,
                'TGID': 3121,
                'ACTIVE': True,
                'TIMEOUT': 0,
