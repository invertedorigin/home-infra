apiVersion: v1
kind: ConfigMap
metadata:
  name: hblink-config
data:
  rules.py: |-
    # TG 9999 on TS2 is bridged to a loopback-only playback master. The
    # playback port is not exposed by the Service or the WireGuard firewall.
    BRIDGES = {
        # XLX303 module D is selected with private call 4004. XLXD carries the
        # module's DMR audio as TG 9 on TS2, which is exposed locally as
        # Colorado HD TG 31088 on TS1.
        'XLX303-D': [
            {
                'SYSTEM': 'MASTER-1',
                'TS': 1,
                'TGID': 31088,
                'ACTIVE': True,
                'TIMEOUT': 0,
                'TO_TYPE': 'NONE',
                'ON': [],
                'OFF': [],
                'RESET': [],
            },
            {
                'SYSTEM': 'XLX303-D',
                'TS': 2,
                'TGID': 9,
                'ACTIVE': True,
                'TIMEOUT': 0,
                'TO_TYPE': 'NONE',
                'ON': [],
                'OFF': [],
                'RESET': [],
            },
        ],
        'PARROT': [
            {
                'SYSTEM': 'MASTER-1',
                'TS': 2,
                'TGID': 9999,
                'ACTIVE': True,
                'TIMEOUT': 0,
                'TO_TYPE': 'NONE',
                'ON': [],
                'OFF': [],
                'RESET': [],
            },
            {
                'SYSTEM': 'PARROT',
                'TS': 2,
                'TGID': 9999,
                'ACTIVE': True,
                'TIMEOUT': 0,
                'TO_TYPE': 'NONE',
                'ON': [],
                'OFF': [],
                'RESET': [],
            },
        ],
    }
    UNIT = ['MASTER-1']
