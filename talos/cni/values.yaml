---
bgpControlPlane:
  enabled: true
# Pin the datapath to the LAN NIC. Auto-detection would also adopt dummy-api
# while it holds the API VIP, reloading the datapath each time kube-vip adds or
# removes it.
devices: ens18
endpointRoutes:
  enabled: true
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
ipam:
  mode: kubernetes
# ipv4NativeRoutingCIDR: 10.244.0.0/16
k8sServiceHost: localhost
k8sServicePort: 7445
kubeProxyReplacement: true
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
ingressController:
  enabled: true
  loadbalancerMode: shared
  hostNetwork:
    enabled: false
  service:
    externalTrafficPolicy: Cluster
loadBalancer:
  algorithm: maglev
  l7:
    algorithm: round_robin
    backend: envoy
l2announcements:
  enabled: true
nodePort:
  enabled: true
localRedirectPolicy: true
operator:
  rollOutPods: true
rollOutCiliumPods: true
securityContext:
  privileged: true
cni:
  exclusive: false
