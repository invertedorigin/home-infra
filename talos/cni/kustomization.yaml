---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- l2-address-pool.yaml

helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.20.1
    releaseName: cilium
    namespace: kube-system
    valuesFile: values.yaml

patches:
- path: cilium-ingress-service-patch.yaml
  target:
    version: v1
    kind: Service
    name: cilium-ingress
    namespace: kube-system
