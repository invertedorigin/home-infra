# usb-node-2: Talos 1.14.1 worker overrides
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.model == "QEMU HARDDISK"
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
$patch: delete
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
$patch: delete
---
apiVersion: v1alpha1
kind: SecurityProfileConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nbd
---
apiVersion: v1alpha1
kind: ResolverConfig
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true
  resolveMemberNames: true
---
apiVersion: v1alpha1
kind: KubePrismConfig
port: 7445
---
apiVersion: v1alpha1
kind: SysctlConfig
params:
  net.core.rmem_max: "2500000"
  net.core.wmem_max: "2500000"
  net.ipv6.conf.all.accept_ra: "2"
  net.ipv6.conf.default.accept_ra: "2"
  net.ipv6.conf.ens18.accept_ra_rt_info_max_plen: "64"
  net.ipv6.conf.all.accept_ra_rt_info_max_plen: "64"
---
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: enable-unprivileged
content: |
  [plugins."io.containerd.grpc.v1.cri"]
    enable_unprivileged_ports = true
    enable_unprivileged_icmp = true
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.0.1.0/24
labels:
  hardware.invertedorigin.com/usb: "true"
  topology.kubernetes.io/region: home
taints:
  hardware.invertedorigin.com/usb: "true:NoSchedule"
---
apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - 10.244.0.0/16
serviceSubnets:
  - 10.245.0.0/16
---
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: usb-node-2
auto: "off"
