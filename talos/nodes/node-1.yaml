# node-1: Talos 1.13.10 control plane overrides
machine:
  install:
    diskSelector:
      model: QEMU HARDDISK
  kernel:
    modules:
      - name: nbd
  features:
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
      resolveMemberNames: true
    kubePrism:
      enabled: true
      port: 7445
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:admin
      allowedKubernetesNamespaces:
        - system-upgrade
  sysctls:
    net.core.rmem_max: "2500000"
    net.core.wmem_max: "2500000"
    net.ipv6.conf.all.accept_ra: "2"
    net.ipv6.conf.default.accept_ra: "2"
    net.ipv6.conf.ens18.accept_ra_rt_info_max_plen: "64"
    net.ipv6.conf.all.accept_ra_rt_info_max_plen: "64"
  files:
    - content: |
        [plugins."io.containerd.grpc.v1.cri"]
          enable_unprivileged_ports = true
          enable_unprivileged_icmp = true
      path: /etc/cri/conf.d/20-customization.part
      op: create
  kubelet:
    nodeIP:
      validSubnets:
        - 10.0.1.0/24
  nodeLabels:
    node.kubernetes.io/exclude-from-external-load-balancers:
      $patch: delete
    topology.kubernetes.io/region: home
cluster:
  network:
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.245.0.0/16
    cni:
      name: none
  allowSchedulingOnMasters: true
  allowSchedulingOnControlPlanes: true
  apiServer:
    certSANs:
      - 10.0.1.10
  proxy:
    disabled: true
  discovery:
    enabled: true
    registries:
      kubernetes:
        disabled: true
      service: {}
  etcd:
    advertisedSubnets:
      - 10.0.1.0/24
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 10.0.1.10
link: ens18
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: node-1
auto: "off"
---
apiVersion: v1alpha1
kind: ResolverConfig
searchDomains:
  domains: []
